[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingverse-de2sim"
version = "0.1.0"
description = "Generic digital-engineering to simulation pipeline MVP"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.6",
  "trimesh>=4.4",
  "PyYAML>=6.0",
  "numpy>=1.26"
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
de2sim = "pipeline:main"

[tool.setuptools]
py-modules = ["pipeline"]
