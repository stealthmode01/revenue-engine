name: Army Challenge II MVP

on:
  push:
    paths:
      - "ventures/army-training-verse-ch2/**"
      - ".github/workflows/army-ch2.yml"
  pull_request:
    paths:
      - "ventures/army-training-verse-ch2/**"
      - ".github/workflows/army-ch2.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/army-training-verse-ch2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python scripts/generate_sample.py
      - run: python pipeline.py build samples/manifest.yaml --out build/demo
      - run: python pipeline.py simulate build/demo/package.json --seconds 2 --out build/demo/trajectory.json
